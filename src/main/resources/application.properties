spring.application.name=library-api

# Local lab database: data is discarded when the application stops.
spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Hibernate must create the tables before data.sql populates them.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.mvc.problemdetails.enabled=true

# Local development console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
